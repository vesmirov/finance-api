services:
  web:
    build: ../finance-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8090:8080"
    restart: unless-stopped

  api:
    build: .
    environment:
      FINANCE_RATES_REFRESH: ${FINANCE_RATES_REFRESH:-5m}
    volumes:
      - data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  data:
